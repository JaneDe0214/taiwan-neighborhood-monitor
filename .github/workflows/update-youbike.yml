name: 自動更新 YouBike 即時數據

on:
  schedule:
    # 每 10 分鐘定時更新
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 執行 YouBike 即時同步腳本
        run: node scripts/sync-youbike.js

      - name: 提交並推送最新數據
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/youbike.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 自動更新 YouBike 2.0 即時數據 [skip ci]" && git push)
