name: 自動更新雙埔大眾運輸與 YouBike 資料

on:
  schedule:
    # 台灣日間營運時間 06:00 ~ 24:00 (UTC 22:00 ~ 15:59)：每 15 分鐘錯峰保底執行，避免高頻排程遭 GitHub Actions 佇列節流丟棄
    - cron: '7,22,37,52 22-23,0-15 * * *'
    # 台灣深夜收班時間 00:00 ~ 06:00 (UTC 16:00 ~ 21:59)：每 30 分鐘執行一次
    - cron: '17,47 16-21 * * *'
  workflow_dispatch:
  # 支援外部高優先級 Webhook 秒級觸發 (如 cron-job.org / Cloudflare Workers / UptimeRobot)
  repository_dispatch:
    types: [sync-transit-data, webhook-trigger]

permissions: {}

# 避免高頻執行時 Git push 衝突，確保同一時間僅有一組更新作業執行
concurrency:
  group: transit-data-sync
  cancel-in-progress: false

jobs:
  update-transit-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: 檢出專案程式碼 (淺層檢出極速加速)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 執行全量大眾運輸與 YouBike 同步中樞腳本
        run: node scripts/sync-all.js

      - name: 提交並推送最新資料至 GitHub Pages 同源資料庫
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add data/*.json
            if git diff --cached --quiet; then
              echo "無資料異動，略過提交"
              exit 0
            fi
            git commit -m "chore: 極速更新全線大眾運輸與 YouBike 即時資料 [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "推送發生遠端更新衝突，重設至最新 origin/main 後重新執行同步 (第 ${attempt} 次)..."
            git fetch origin main --depth=2
            git reset --hard origin/main
            node scripts/sync-all.js
          done
          exit 1
