name: 自動更新雙埔大眾運輸與 YouBike 數據

on:
  schedule:
    # 每 10 分鐘定時全自動更新 (高鐵、機捷、捷運看板與 YouBike)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-transit-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 執行全量大眾運輸與 YouBike 同步中樞腳本
        run: node scripts/sync-all.js

      - name: 提交並推送最新數據至 GitHub Pages 同源資料庫
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 自動更新全線大眾運輸與 YouBike 即時數據 [skip ci]" && git push)
